name: e2e-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: claims
          POSTGRES_PASSWORD: claims_local_dev
          POSTGRES_DB: claims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claims -d claims"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      DATABASE_URL: postgres://claims:claims_local_dev@localhost:5432/claims

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # no stored secrets: every run mints its own JWT secret
      - name: Generate per-run JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - run: npm run typecheck

      # the committed OpenAPI spec must match what the code generates
      - name: Contract drift gate
        run: |
          npm run openapi:generate --workspace @expense-claims/api
          git diff --exit-code apps/api/openapi/openapi.json

      - run: npm run test:unit

      - name: Apply database migrations
        run: npm run db:migrate --workspace @expense-claims/api

      - run: npm run test:api

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
