services:
  api:
    profiles: ['app'] # opt-in: `docker compose --profile app up`
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://claims:claims_local_dev@db:5432/claims
      JWT_SECRET: local-compose-secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims_local_dev
      POSTGRES_DB: claims
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U claims -d claims']
      interval: 2s
      timeout: 2s
      retries: 15
